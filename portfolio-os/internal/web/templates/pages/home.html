{{ define "content" }}

<link rel="stylesheet" href="/static/css/landing.css" />

<main class="hero-stage">
  <!-- Backdrop Ambient Spheres -->
  <div class="crimson-circle-bg"></div>
  <div class="crimson-small-circle-bg"></div>

  <!-- Top Navigation -->
  <header class="hero-navbar">
    <div class="hero-brand">
      <span class="brand-stripes">
        <span></span><span></span><span></span>
      </span>
      <span class="brand-name">{{ .Portfolio.Profile.Name }}</span>
    </div>

    <nav class="hero-nav">
      <a href="/client#about">ABOUT</a>
      <a href="/client#projects">GALLERY</a>
      <a href="/client#contact">CONTACTS</a>
    </nav>
  </header>

  <!-- Central Showcase Section (70% W x 65% H) -->
  <section class="hero-body">
    <!-- Glowing Bouncing Ping Pong Balls Canvas -->
    <canvas id="hero-balls-canvas"></canvas>

    <!-- Left Column: Copy & Actions -->
    <div class="hero-text-content">
      <span class="hero-subtitle">SYSTEM ARCHITECTURE & SECURITY</span>

      <h1 class="hero-heading">DEVELOPER</h1>

      <p class="hero-description">{{ .Portfolio.Profile.Bio }}</p>

      <!-- View Selection -->
      <div class="hero-cta-group">
        <a href="/developer" class="home-view-btn home-view-btn-primary">
          <span class="home-view-content">
            <span class="home-view-label">Developer View</span>
          </span>
        </a>

        <a href="/client" class="home-view-btn home-view-btn-secondary">
          <span class="home-view-content">
            <span class="home-view-label">Client View</span>
          </span>
        </a>
      </div>
    </div>

    <!-- Right Column: Hero Figure with Top-to-Bottom Color Reveal -->
    <div class="hero-art-container">
      <div class="art-glow-orb"></div>

      <img
        src="/static/images/profilee.png"
        alt="{{ .Portfolio.Profile.Name }}"
        class="hero-sculpture"
      />

      <!-- Grayscale wipe overlay -->
      <div class="art-grayscale-overlay"></div>
    </div>
  </section>

  <!-- Bottom Slider / Version Footer -->
  <footer class="hero-footer">
    <div class="footer-tracker">
      <span class="num active">01</span>

      <div class="progress-bar">
        <span class="fill"></span>
      </div>

      <span class="num">02</span>
    </div>

    <div class="footer-status">
      <span class="status-dot"></span>
      <span>{{ .Portfolio.Profile.Availability }}</span>
    </div>
  </footer>
</main>

<script>
(function() {
  const canvas = document.getElementById('hero-balls-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');

  let width, height;
  function resize() {
    width = canvas.width = canvas.parentElement.offsetWidth;
    height = canvas.height = canvas.parentElement.offsetHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const colors = [
    { r: 245, g: 208, b: 97 },  // Gold
    { r: 230, g: 57,  b: 70 },  // Crimson
    { r: 0,   g: 245, b: 212 }, // Cyan / Teal
    { r: 168, g: 85,  b: 247 }, // Neon Violet
    { r: 255, g: 0,   b: 110 }, // Hot Pink
    { r: 56,  g: 189, b: 248 }  // Electric Blue
  ];

  function getRandomColor(excludeColor) {
    const available = colors.filter(c => c !== excludeColor);
    return available[Math.floor(Math.random() * available.length)];
  }

  class Ball {
    constructor() {
      this.radius = Math.random() * 4 + 4;
      this.x = Math.random() * (width - this.radius * 2) + this.radius;
      this.y = Math.random() * (height - this.radius * 2) + this.radius;
      
      const speed = Math.random() * 2.5 + 2.0;
      const angle = Math.random() * Math.PI * 2;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;

      this.color = getRandomColor(null);
      this.trail = [];
      this.maxTrail = 18;
    }

    update() {
      this.trail.unshift({ x: this.x, y: this.y, color: this.color });
      if (this.trail.length > this.maxTrail) {
        this.trail.pop();
      }

      this.x += this.vx;
      this.y += this.vy;

      let bounced = false;

      if (this.x - this.radius <= 0) {
        this.x = this.radius;
        this.vx *= -1;
        bounced = true;
      } else if (this.x + this.radius >= width) {
        this.x = width - this.radius;
        this.vx *= -1;
        bounced = true;
      }

      if (this.y - this.radius <= 0) {
        this.y = this.radius;
        this.vy *= -1;
        bounced = true;
      } else if (this.y + this.radius >= height) {
        this.y = height - this.radius;
        this.vy *= -1;
        bounced = true;
      }

      if (bounced) {
        this.color = getRandomColor(this.color);
      }
    }

    draw() {
      for (let i = 0; i < this.trail.length; i++) {
        const pt = this.trail[i];
        const progress = 1 - (i / this.maxTrail);
        const radius = this.radius * progress * 0.85;

        ctx.beginPath();
        ctx.arc(pt.x, pt.y, Math.max(radius, 0.5), 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${pt.color.r}, ${pt.color.g}, ${pt.color.b}, ${progress * 0.45})`;
        ctx.shadowBlur = 0;
        ctx.fill();
      }

      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fillStyle = `rgb(${this.color.r}, ${this.color.g}, ${this.color.b})`;
      ctx.shadowColor = `rgb(${this.color.r}, ${this.color.g}, ${this.color.b})`;
      ctx.shadowBlur = 16;
      ctx.fill();
    }
  }

  const ballCount = 14;
  const balls = Array.from({ length: ballCount }, () => new Ball());

  function animate() {
    ctx.clearRect(0, 0, width, height);
    balls.forEach(ball => {
      ball.update();
      ball.draw();
    });
    requestAnimationFrame(animate);
  }

  animate();
})();
</script>

{{ end }}
